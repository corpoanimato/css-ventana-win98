<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventana Win98</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="scene">
  <div class="stage">

    <!-- Ventana principal -->
    <div class="window98 main">
      <div class="titlebar98">
        <span class="title-text">readme.txt - Bloc de notas</span>
        <div class="win98-btns">
          <button class="win98-btn" aria-label="Minimizar">━</button>
          <button class="win98-btn" aria-label="Maximizar">▭</button>
          <button class="win98-btn" aria-label="Cerrar">Ⓧ</button>
        </div>
      </div>
      <div class="menubar98">
        <span><u>F</u>ile</span>
        <span><u>E</u>dit</span>
        <span><u>V</u>iew</span>
        <span><u>H</u>elp</span>
      </div>
      <!--Contenido de la ventana-->
      <div>
        <div class="content98"><p>jkklkl</p></div>
      </div>
    </div>

    <!-- Ventana emergente -->
    <div class="window98 popup">
      <div class="titlebar98 pink">
        <span class="title-text">pintar pintar.png</span>
        <div class="win98-btns">
          <button class="win98-btn" aria-label="Cerrar">Ⓧ</button>
        </div>
      </div>
      <div class="menubar98">
        <span><u>F</u>ile</span>
        <span><u>E</u>dit</span>
        <span><u>V</u>iew</span>
      </div>
      <div class="content98"></div>
    </div>

  </div>
</div>

</body>
</html>
